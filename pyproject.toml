[project]
name = "oidcauth-py"
version = "0.2.0"
description = "OpenID Connect login for Python web apps: authorization code + PKCE, encrypted flow cookie, ID token verification, refresh, revocation, RP-initiated and back-channel logout, a FastAPI/Starlette adapter, a fake provider for tests, and Zitadel's headless identity provider login."
readme = "README.md"
requires-python = ">=3.10, <4.0"
authors = [
    { name = "Do Quoc Vuong", email = "vuongtlt13@gmail.com" },
]
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Framework :: AsyncIO",
    "Framework :: FastAPI",
    "Topic :: Security",
    "Typing :: Typed",
]
keywords = ["oidc", "openid-connect", "oauth2", "pkce", "zitadel", "fastapi", "sso"]
dependencies = [
    "cryptography>=42.0.0",
    "httpx>=0.27.0",
    "joserfc>=1.0.0",
]

[project.optional-dependencies]
fastapi = ["starlette>=0.37.0"]

[project.urls]
Homepage = "https://github.com/vuongtlt13/oidcauth-py"
Issues = "https://github.com/vuongtlt13/oidcauth-py/issues"
License = "https://opensource.org/licenses/MIT"

[build-system]
requires = ["uv_build >= 0.8.0, <0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "oidcauth"

[dependency-groups]
dev = [
    "black>=25.1.0",
    "coverage>=7.6.0",
    "fakeredis>=2.26.0",
    "fastapi>=0.115.0",
    "isort>=6.0.0",
    "mypy>=1.15.0",
    "pre-commit>=4.0.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-vv --strict-config --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
source = ["oidcauth"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 0
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.black]
line-length = 88
target-version = ['py310']

[tool.isort]
profile = "black"

[tool.mypy]
files = ["src/oidcauth"]
python_version = "3.10"
ignore_missing_imports = true
strict = true
